apiVersion: v1
kind: Secret
metadata: { name: auth-service-secrets, namespace: auth }
type: Opaque
stringData:
  DATABASE_URL: postgres://tmadmin:<SENHA>@<ENDPOINT_RDS_AUTH>:5432/auth_db?sslmode=require
  MASTER_KEY: <MASTER_KEY>
---
