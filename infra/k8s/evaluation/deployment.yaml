apiVersion: apps/v1
kind: Deployment
metadata: { name: evaluation-service, namespace: evaluation, labels: { app: evaluation-service } }
spec:
  selector: { matchLabels: { app: evaluation-service } }
  template:
    metadata: { labels: { app: evaluation-service } }
    spec:
      serviceAccountName: evaluation-service
      containers:
        - name: evaluation-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:latest
          ports: [{ name: http, containerPort: 8004 }]
          envFrom:
            - configMapRef: { name: evaluation-service-config }
            - secretRef: { name: evaluation-service-secrets }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
