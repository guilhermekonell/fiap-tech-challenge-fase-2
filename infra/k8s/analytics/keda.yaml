apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: { name: aws-sqs-keda-identity, namespace: analytics }
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: analytics-service, namespace: analytics }
spec:
  scaleTargetRef: { name: analytics-service }
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: aws-sqs-queue
      authenticationRef: { name: aws-sqs-keda-identity }
      metadata:
        queueURL: "https://sqs.us-east-1.amazonaws.com/<AWS_ACCOUNT_ID>/tm-evaluation-events"
        queueLength: "5"
        awsRegion: "us-east-1"
