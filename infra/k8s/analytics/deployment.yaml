apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service, namespace: analytics, labels: { app: analytics-service } }
spec:
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      serviceAccountName: analytics-service
      containers:
        - name: analytics-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/analytics-service:latest
          ports: [{ name: http, containerPort: 8005 }]
          envFrom:
            - configMapRef: { name: analytics-service-config }
            - secretRef: { name: analytics-service-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
