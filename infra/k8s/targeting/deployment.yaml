apiVersion: apps/v1
kind: Deployment
metadata: { name: targeting-service, namespace: targeting, labels: { app: targeting-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: targeting-service } }
  template:
    metadata: { labels: { app: targeting-service } }
    spec:
      containers:
        - name: targeting-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/targeting-service:latest
          ports: [{ name: http, containerPort: 8003 }]
          envFrom:
            - configMapRef: { name: targeting-service-config }
            - secretRef: { name: targeting-service-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 250m, memory: 192Mi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
