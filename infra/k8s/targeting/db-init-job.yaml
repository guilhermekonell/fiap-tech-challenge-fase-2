apiVersion: batch/v1
kind: Job
metadata: { name: targeting-service-db-init, namespace: targeting }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/init.sql"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: targeting-service-secrets, key: DATABASE_URL } }
          volumeMounts: [{ name: sql, mountPath: /sql }]
      volumes:
        - name: sql
          configMap: { name: targeting-service-db-init }
