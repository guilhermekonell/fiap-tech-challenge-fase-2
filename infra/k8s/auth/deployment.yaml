apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: auth, labels: { app: auth-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/auth-service:latest
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: auth-service-config }
            - secretRef: { name: auth-service-secrets }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
