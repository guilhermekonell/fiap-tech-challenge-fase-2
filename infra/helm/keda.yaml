podIdentity:
  aws:
    irsa:
      enabled: true
      roleArn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/tm-irsa-keda
resources:
  operator:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  metricServer:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  webhooks:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
